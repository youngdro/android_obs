name: Build & Verify

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    name: 构建 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug & release APK
        run: ./gradlew --no-daemon assembleDebug assembleRelease lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: livecomposer-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  rtmp-e2e:
    name: 推流模块端到端测试（ffmpeg 作为接收端）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run RTMP / RTMPS / reconnect tests
        run: bash verify/run-e2e.sh
